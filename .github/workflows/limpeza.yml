name: limpeza

# Apaga pastas posts/publicacao-YYYY-MM-DD_HHMMSS/ com mais de
# DIAS_RETENCAO dias — o Instagram só precisa da URL da imagem no
# momento da publicação (a Graph API baixa e hospeda a mídia própria ao
# criar o container), então manter a imagem pública pra sempre neste
# repo não é necessário depois disso. Pedido do usuário, 02/08/2026
# (mesmo padrão do morar-sp-midia/lembrei-instagram-midia).
#
# Roda 1x por mês (dia 1, 05:00 UTC = 02:00 BRT).
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      dias_retencao:
        description: "Apagar pastas com mais de quantos dias (padrão 30)"
        required: false
        default: "30"

permissions:
  contents: write

jobs:
  limpeza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apagar pastas antigas
        run: |
          DIAS_RETENCAO="${{ inputs.dias_retencao || '30' }}"
          LIMITE=$(date -u -d "-$DIAS_RETENCAO days" +%Y-%m-%d)
          echo "Apagando pastas posts/publicacao-<data>_<hora> anteriores a $LIMITE (retenção: $DIAS_RETENCAO dias)"

          APAGADAS=0
          for pasta in posts/*/; do
            nome=$(basename "$pasta")
            # nome = publicacao-YYYY-MM-DD_HHMMSS -- extrai só a data
            data="${nome#publicacao-}"
            data="${data%%_*}"
            if [[ "$data" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$data" < "$LIMITE" ]]; then
              echo "Apagando posts/$nome"
              git rm -r --quiet "posts/$nome"
              APAGADAS=$((APAGADAS + 1))
            fi
          done

          echo "Pastas apagadas: $APAGADAS"
          echo "APAGADAS=$APAGADAS" >> "$GITHUB_ENV"

      - name: Commitar
        if: env.APAGADAS != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Limpeza automática: remove $APAGADAS pasta(s) de posts com mais de ${{ inputs.dias_retencao || '30' }} dias"
          git push
